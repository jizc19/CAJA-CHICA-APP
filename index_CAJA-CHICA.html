<style>
/* ============================================================
   TOKENS — Sistema de Viáticos — Tema oscuro
   Dirección: "Libro contable nocturno" — tinta profunda, papel
   oscuro y un dorado tipo sello de cera para la acción principal.
   Los estados (comprobante) usan verde/ámbar/rojo semánticos,
   no un único acento genérico repetido en todo.
   ============================================================ */
:root {
  /* Paleta de marca "Cisne negro" (Colineal) — la misma cromática que
     INSTALACIONES-APP, para que las dos herramientas de la empresa se
     vean como una sola familia. */
  --bg-950: #050507;      /* fondo de la app */
  --bg-900: #120e0d;      /* fondo de paneles grandes */
  --surface-800: #1c1818; /* tarjetas */
  --surface-700: #242020; /* tarjetas elevadas / hover */
  --surface-600: #2d2827; /* inputs, superficies interactivas */
  --line: #3b3332;        /* bordes y reglas finas */
  --line-strong: #4e4443;

  /* Texto */
  --text-100: #f2f1ec;
  --text-300: #c9c6bf;
  --text-500: #aaaca1;

  /* Acento principal — rojo Colineal (acción primaria) */
  --gold-400: #e3311d;
  --gold-500: #cc2b1a;
  --gold-600: #a82316;
  --gold-bg: #2e1512;
  --gold-ink: #ffffff;

  /* Estados del comprobante — semánticos (se mantienen distintos del
     rojo de marca para no confundir "acción" con "alerta") */
  --state-ok: #5fc48a;
  --state-ok-bg: #12241a;
  --state-pending: #dda23f;
  --state-pending-bg: #2c2013;
  --state-missing: #ff5470;
  --state-missing-bg: #33131b;

  --danger: #ff5470;
  --danger-bg: #33131b;
  --danger-strong: #e3311d;

  --font-display: "Space Grotesk", "Inter", -apple-system, sans-serif;
  --font-body: "Inter", -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;

  --fs-xs: 0.75rem;
  --fs-sm: 0.8125rem;
  --fs-base: 0.9375rem;
  --fs-md: 1.0625rem;
  --fs-lg: 1.375rem;
  --fs-xl: 1.875rem;
  --fs-2xl: 2.5rem;

  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;

  --radius-sm: 6px;
  --radius-md: 10px;

  --shadow-card: 0 1px 0 rgba(255,255,255,0.03) inset, 0 6px 20px rgba(0,0,0,0.35);
  --shadow-pop: 0 20px 50px rgba(0,0,0,0.5);

  --sidebar-w: 248px;
  --topbar-h: 64px;
  --bottomnav-h: 64px;

  /* Alias retrocompatibles con nombres usados en los módulos existentes */
  --paper-0: var(--bg-950);
  --paper-50: var(--surface-800);
  --paper-100: var(--surface-700);
  --ink-900: var(--text-100);
  --ink-700: var(--text-100);
  --ink-500: var(--text-300);
  --ledger-700: var(--gold-500);
  --ledger-500: var(--gold-400);
  --ledger-100: var(--gold-bg);
  --stamp-ok: var(--state-ok); --stamp-ok-bg: var(--state-ok-bg);
  --stamp-pending: var(--state-pending); --stamp-pending-bg: var(--state-pending-bg);
  --stamp-missing: var(--state-missing); --stamp-missing-bg: var(--state-missing-bg);
}
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg-950);
  color: var(--text-100);
  font-family: var(--font-body);
  font-size: var(--fs-base);
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%; /* evita que Safari agrande el texto automáticamente en bloques anchos */
  text-size-adjust: 100%;
}

/* Sin "rebote" al llegar arriba o abajo (iPhone): el rebote estiraba la barra superior y
   arrastraba la barra inferior hacia arriba al deslizar el dedo. */
html { overscroll-behavior: none; }
body {
  overscroll-behavior: none;
  background-image:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(227,49,29,0.05), transparent),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(95,196,138,0.04), transparent);
  background-attachment: fixed;
}

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }

.tabular { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.mono { font-family: var(--font-mono); }

:focus-visible {
  outline: 2px solid var(--gold-400);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* ---------- Entrada de marca ---------- */
.brand-intro {
  position: fixed; inset: 0; z-index: 20000; display: grid; place-items: center;
  overflow: hidden; background: radial-gradient(ellipse at 50% 46%, #211615 0%, #100d0c 40%, #050507 78%);
  opacity: 1; visibility: visible; transition: opacity .42s cubic-bezier(.32,.72,0,1), visibility .42s;
}
.brand-intro.salir { opacity: 0; visibility: hidden; }
.brand-intro__halo {
  position: absolute; width: min(62vw, 340px); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle, rgba(227,49,29,.21) 0%, rgba(227,49,29,.07) 38%, transparent 72%);
  filter: blur(16px); animation: intro-resplandor 1.5s ease-in-out infinite alternate;
}
.brand-intro__contenido { position: relative; display: grid; justify-items: center; gap: 18px; animation: intro-aparecer .72s cubic-bezier(.2,.75,.25,1) both; }
.brand-intro__logo { width: clamp(156px, 45vw, 224px); height: auto; padding: 9px 12px; box-sizing: border-box; border-radius: 12px; background: #fff; box-shadow: 0 12px 44px rgba(0,0,0,.42); opacity: 0; transition: opacity .2s ease; }
.brand-intro.listo .brand-intro__logo { opacity: 1; }
.brand-intro__regla { width: 38px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, #a92316, #f05a35, #a92316); box-shadow: 0 0 16px rgba(240,90,53,.45); transform-origin: center; animation: intro-regla .7s .16s cubic-bezier(.32,.72,0,1) both; }
.brand-intro__texto { color: rgba(255,255,255,.68); font: 600 10px/1.2 system-ui, sans-serif; letter-spacing: .22em; text-transform: uppercase; }
@keyframes intro-aparecer { from { opacity: 0; transform: translateY(8px) scale(.965); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes intro-regla { from { opacity: 0; transform: scaleX(.15); } to { opacity: 1; transform: scaleX(1); } }
@keyframes intro-resplandor { from { opacity: .52; transform: scale(.92); } to { opacity: .9; transform: scale(1.08); } }
@media (prefers-reduced-motion: reduce) { .brand-intro { display: none !important; } }
/* ---------- Shell ---------- */
#app-shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 100vh;
}

.sidebar {
  background: var(--bg-900);
  border-right: 1px solid var(--line);
  color: var(--text-100);
  padding: var(--sp-5) var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-6);
  position: sticky;
  top: 0;
  height: 100vh;
}

.brand {
  display: flex;
  align-items: baseline;
  gap: var(--sp-2);
  padding: 0 var(--sp-2);
}
.brand-plate {
  flex: 0 0 auto;
  width: clamp(96px, 30vw, 140px);
  background: #fff;
  border-radius: 10px;
  padding: 5px 7px;
  box-sizing: border-box;
  box-shadow: 0 2px 10px rgba(0,0,0,.35);
  border: 1px solid rgba(255,255,255,.6);
}
.brand-plate img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 2364 / 992;
  pointer-events: none;
}
.dash-hero { display: flex; flex-direction: column; gap: var(--sp-4); margin-bottom: var(--sp-5);
  padding-bottom: var(--sp-5); border-bottom: 1px solid var(--line); }
.dash-hero-texto { min-width: 0; }
.dash-fecha { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--gold-400); margin-bottom: 6px; }
.dash-saludo { font-family: var(--font-display); font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 600;
  letter-spacing: -0.02em; line-height: 1.1; color: var(--text-100); margin-bottom: 8px; }
.dash-frase { font-size: var(--fs-sm); line-height: 1.5; color: var(--text-300); max-width: 46ch; }
.dash-frase strong { color: var(--text-100); font-weight: 600; }
.dash-frase strong.neg { color: var(--danger); }
.dash-avisos { display: flex; flex-wrap: wrap; gap: 8px; }
.dash-aviso { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
  font-size: var(--fs-xs); font-weight: 500; border: 1px solid transparent; }
.dash-aviso i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.dash-aviso.pend { color: var(--state-pending); background: var(--state-pending-bg); border-color: color-mix(in srgb, var(--state-pending) 30%, transparent); }
.dash-aviso.sin { color: var(--state-missing); background: var(--state-missing-bg); border-color: color-mix(in srgb, var(--state-missing) 30%, transparent); }
.dash-aviso.ok { color: var(--state-ok); background: var(--state-ok-bg); border-color: color-mix(in srgb, var(--state-ok) 30%, transparent); }
.dash-acciones { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.aviso-respaldo { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); flex-wrap: wrap;
  padding: 12px 14px; margin-bottom: var(--sp-5); border-radius: var(--radius-md); background: var(--state-pending-bg);
  border: 1px solid color-mix(in srgb, var(--state-pending) 35%, transparent); }
.aviso-respaldo div { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 260px; }
.aviso-respaldo strong { color: var(--state-pending); font-size: var(--fs-sm); }
.aviso-respaldo span { color: var(--text-300); font-size: var(--fs-xs); line-height: 1.45; }
.lista-eleccion { display: flex; flex-direction: column; gap: 8px; }
.eleccion { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; text-align: left; padding: 12px 14px;
  border-radius: var(--radius-sm); border: 1px solid var(--line-strong); background: var(--surface-700); color: var(--text-100); min-height: 48px; }
.eleccion:hover, .eleccion:focus-visible { border-color: var(--gold-500); }
.eleccion span { font-size: var(--fs-xs); color: var(--text-500); }
.dash-saludo .pos { color: var(--state-ok); }
.dash-saludo .neg { color: var(--danger); }
.dash-saludo .warn { color: var(--state-pending); }
/* Comprobantes que requieren seguimiento */
.dash-justificar { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.dj-item { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: var(--radius-md, 12px); border: 1px solid var(--line); background: var(--surface-800, #1b1817); }
.dj-lbl { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-500); }
.dj-lbl i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.dj-item.pend .dj-lbl i { background: var(--state-pending); }
.dj-item.sin .dj-lbl i { background: var(--state-missing); }
.dj-val { font-family: var(--font-display); font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.dj-item.pend .dj-val { color: var(--state-pending); }
.dj-item.sin .dj-val { color: var(--state-missing); }
.dj-sub { font-size: var(--fs-xs); color: var(--text-500); }
/* Resumen por proyecto */
.dash-tabla-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: var(--radius-md, 12px); background: var(--surface-800, #1b1817); }
.dash-tabla { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); min-width: 520px; }
.dash-tabla th { font-family: var(--font-mono); font-size: 0.64rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-500); text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.dash-tabla td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
.dash-tabla tbody tr { cursor: pointer; transition: background .15s; }
.dash-tabla tbody tr:hover, .dash-tabla tbody tr:focus-visible { background: var(--surface-700); outline: none; }
.dash-tabla tbody tr:last-child td { border-bottom: none; }
.dash-tabla td:first-child { position: sticky; left: 0; background: inherit; min-width: 120px; }
.dash-tabla tbody td:first-child { background: var(--surface-800, #1b1817); }
.dash-tabla tbody tr:hover td:first-child { background: var(--surface-700); }
.dash-tabla td:first-child a { display: block; color: var(--text-100); font-weight: 600; text-decoration: none; }
.dash-tabla td:first-child span { display: block; font-size: var(--fs-xs); color: var(--text-500); margin-top: 2px; }
.dash-tabla .num { text-align: right; font-variant-numeric: tabular-nums; }
.dash-tabla .pos { color: var(--state-ok); }
.dash-tabla .neg { color: var(--danger); }
.dash-tabla .warn { color: var(--state-pending); font-weight: 600; }
.dash-tabla .muted { color: var(--text-500); }
.dash-tabla tfoot td { font-weight: 700; border-top: 1px solid var(--line-strong); border-bottom: none; background: var(--surface-700); }
.dash-nota { font-size: var(--fs-xs); color: var(--text-500); margin-top: 8px; }
.dash-tabla tfoot td:first-child { background: var(--surface-700); }
/* Celular: cada proyecto es una fila de tarjeta con sus 4 montos, sin desplazamiento lateral */
@media (max-width: 640px) {
  .dash-tabla { min-width: 0; }
  .dash-tabla thead { display: none; }
  .dash-tabla tbody, .dash-tabla tfoot { display: block; }
  .dash-tabla tr { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .dash-tabla tbody tr:last-child { border-bottom: none; }
  .dash-tabla td { display: block; padding: 0; border: none; white-space: normal; text-align: left !important; font-size: var(--fs-xs); }
  .dash-tabla td:first-child { grid-column: 1 / -1; position: static; min-width: 0; margin-bottom: 8px; display: flex; align-items: baseline; gap: 8px; }
  .dash-tabla td:first-child a, .dash-tabla td:first-child span { display: inline; margin: 0; }
  .dash-tabla td:first-child a { font-size: var(--fs-sm); }
  .dash-tabla td.num::before { content: attr(data-lbl); display: block; font-family: var(--font-mono); font-size: 0.58rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-500); margin-bottom: 3px; font-weight: 400; }
  .dash-tabla td.num { font-weight: 600; color: var(--text-100); }
  .dash-tabla td.num.pos { color: var(--state-ok); }
  .dash-tabla td.num.neg { color: var(--danger); }
  .dash-tabla td.num.warn { color: var(--state-pending); }
  .dash-tabla td.num.muted { color: var(--text-500); font-weight: 400; }
  .dash-tabla tfoot tr { background: var(--surface-700); border-top: 1px solid var(--line-strong); }
  .dash-tabla tfoot td { background: transparent; border-top: none; }
  .dash-tabla tfoot td:first-child { font-size: var(--fs-sm); }
}
.dash-header-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sp-3);
}
.brand-mark {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: var(--fs-lg);
  letter-spacing: -0.01em;
  background: linear-gradient(135deg, var(--gold-400), var(--gold-600));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.brand-sub {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  color: var(--text-500);
  text-transform: uppercase;
}

.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-label {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  color: var(--text-500);
  text-transform: uppercase;
  padding: var(--sp-2) var(--sp-2) var(--sp-1);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-2);
  border-radius: var(--radius-sm);
  font-size: var(--fs-sm);
  font-weight: 500;
  color: var(--text-300);
  border-left: 2px solid transparent;
}
.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.85; }
.nav-item:hover { background: var(--surface-700); color: var(--text-100); }
.nav-item.active {
  background: var(--gold-bg);
  color: var(--gold-400);
  border-left-color: var(--gold-500);
}

.sidebar-foot {
  margin-top: auto;
  font-size: var(--fs-xs);
  color: var(--text-500);
  padding: 0 var(--sp-2);
}

.main-col { display: flex; flex-direction: column; min-height: 100vh; }

.topbar {
  height: calc(40px + env(safe-area-inset-top, 0px));
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: env(safe-area-inset-top, 0px) var(--sp-6) 0;
  border-bottom: 1px solid var(--line);
  background: var(--bg-900);
  position: sticky;
  top: 0;
  z-index: 5;
}
.topbar-miga {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.06em;
  color: var(--text-300);
}
.topbar-marca {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-500);
}
.topbar-actions { display: flex; gap: var(--sp-3); align-items: center; }

.view { padding: var(--sp-6); flex: 1; }

/* ---------- Botones — cada acción se entiende por su color ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-size: var(--fs-sm);
  font-weight: 600;
  white-space: nowrap;
  transition: filter 0.12s ease, transform 0.3s var(--ease-spring), background 0.25s ease, border-color 0.12s ease,
    width 0.35s var(--ease-ios), border-radius 0.35s var(--ease-ios), padding 0.35s var(--ease-ios);
}
.btn:active { transform: scale(0.94); filter: brightness(0.9); transition-duration: 0.08s; }

/* Red de seguridad: cualquier ícono SVG dentro de un botón o enlace-botón que no
   tenga ya un tamaño explícito (nav, kpi, etc.) recibe un tamaño razonable por
   defecto. Sin esto, un <svg> sin width/height se renderiza a 300x150px por
   defecto del navegador — enorme e invisible/roto en botones pequeños. */
.btn svg, button svg, a.btn svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  vertical-align: middle;
}
.gasto-row .acciones button svg { width: 18px; height: 18px; }

/* Primaria — dorado sello, para crear / guardar / avanzar */
.btn-primary {
  background: linear-gradient(180deg, var(--gold-400), var(--gold-500));
  color: var(--gold-ink);
  box-shadow: 0 1px 0 rgba(255,255,255,0.25) inset, 0 4px 14px rgba(227,49,29,0.18);
}
.btn-primary:hover { filter: brightness(1.08); }

/* Secundaria — contorno neutro, para acciones sin riesgo (cancelar, editar) */
.btn-secondary { background: var(--surface-700); border-color: var(--line-strong); color: var(--text-100); }
.btn-secondary:hover { border-color: var(--gold-500); }

/* Ghost — navegación terciaria */
.btn-ghost { background: transparent; color: var(--text-300); }
.btn-ghost:hover { color: var(--text-100); background: var(--surface-700); }

/* Éxito — confirmar, cerrar viático correctamente */
.btn-success { background: var(--state-ok-bg); color: var(--state-ok); border-color: rgba(95,196,138,0.35); }
.btn-success:hover { background: rgba(95,196,138,0.18); }

/* Advertencia — acciones con pendientes (revisar antes de cerrar) */
.btn-warning { background: var(--state-pending-bg); color: var(--state-pending); border-color: rgba(221,162,63,0.35); }
.btn-warning:hover { background: rgba(221,162,63,0.18); }

/* Peligro — eliminar */
.btn-danger { background: var(--danger-bg); color: var(--danger); border-color: rgba(224,104,95,0.35); }
.btn-danger:hover { background: rgba(224,104,95,0.2); }

.btn-sm { padding: var(--sp-2) var(--sp-3); font-size: var(--fs-xs); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; filter: none; }
.btn[data-estado]:disabled { opacity: 1; cursor: default; }

/* ---------- Tarjetas ---------- */
.card {
  background: var(--surface-800);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--sp-5);
}
.card-elevated {
  background: var(--surface-700);
  box-shadow: var(--shadow-card);
  border-color: var(--line-strong);
}

/* ---------- Estampas de estado (elemento distintivo — sello foliado) ---------- */
.stamp {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 0.68rem;
  letter-spacing: 0.06em;
  font-weight: 600;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 3px;
  border: 1.5px solid currentColor;
}
.stamp::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; }
.stamp-ok { color: var(--state-ok); background: var(--state-ok-bg); }
.stamp-pending { color: var(--state-pending); background: var(--state-pending-bg); }
.stamp-missing { color: var(--state-missing); background: var(--state-missing-bg); }

/* ---------- Formularios ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: var(--fs-xs); font-weight: 600; color: var(--text-500); text-transform: uppercase; letter-spacing: 0.04em; }
.field input, .field select, .field textarea {
  padding: var(--sp-3);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface-600);
  color: var(--text-100);
  font-size: 16px; /* nunca menor a 16px: si no, iOS hace zoom automático al tocar el campo y a veces se queda así */
}
.field input::placeholder, .field textarea::placeholder { color: var(--text-500); }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold-500); }
.field-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4); }
/* Los campos nunca más anchos que su columna (las listas con textos largos desbordaban la ventana) */
.field { min-width: 0; }
.field input, .field select, .field textarea { width: 100%; min-width: 0; }
.field input[type="checkbox"], .field input[type="radio"] { width: auto; }
#form-gasto { display: flex; flex-direction: column; gap: var(--sp-4); }
.grupo-factura { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 0 var(--sp-3); background: var(--surface-700); }
.grupo-factura[open] { padding-bottom: var(--sp-3); }
.grupo-factura > summary { cursor: pointer; padding: var(--sp-3) 0; font-size: var(--fs-sm); font-weight: 600; color: var(--text-100); list-style-position: inside; }
.grupo-factura > summary span { font-weight: 400; color: var(--text-500); font-size: var(--fs-xs); }
.grupo-factura .field-row { margin-bottom: var(--sp-3); }
/* ===== Solicitudes (documentos de una hoja): firmas al pie, repartidas y centradas ===== */
.hoja-firmas-doc { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); column-gap: 36px; justify-items: center;
  margin-top: 28px; break-inside: avoid; page-break-inside: avoid; }
.firma-doc { width: 100%; max-width: 250px; text-align: center; color: #1a1a1a; }
.firma-espacio { height: 58px; } /* espacio para firmar a mano */
.firma-linea { border-top: 1px solid #1a1a1a; margin-bottom: 6px; }
.firma-nombre { font-size: 0.8rem; font-weight: 600; min-height: 1.25em; }
.firma-rol { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.04em; color: #555; margin-top: 2px; line-height: 1.35; }
.firma-detalle { font-size: 0.62rem; color: #555; margin-top: 1px; }
/* La hoja ocupa la página y las firmas bajan al pie. El alto deja margen para el encabezado y pie
   que añade el propio navegador (Safari), así nunca sale una hoja extra en blanco. */
#zona-impresion .hoja-documento, .visor-informe .hoja-documento { display: flex; flex-direction: column; }
#zona-impresion .hoja-documento { min-height: 170mm; }
html[data-orientacion-pdf="vertical"] #zona-impresion .hoja-documento { min-height: 257mm; }
#zona-impresion .hoja-documento > .hoja-firmas-doc { margin-top: auto !important; padding-top: 28px; }
.visor-informe .hoja-documento { display: block; }
.visor-informe .hoja-documento > .hoja-firmas-doc { padding-top: 28px; } /* su posición la calcula la vista previa (igual que el PDF) */
/* Encabezados de tabla en solicitudes: pueden ocupar dos líneas (sirve en vertical y horizontal) */
.hoja-documento .hoja-tabla th { white-space: normal; overflow: visible; line-height: 1.25; vertical-align: bottom; }
/* Nunca partir palabras ni fechas a la mitad ("20/10/202 6", "HOSPEDAJ E"): solo se pasa de línea entre palabras */
.hoja-documento .hoja-tabla th, .hoja-documento .hoja-tabla td { overflow-wrap: normal; word-break: normal; hyphens: none; }
/* En vertical las columnas se ajustan a su contenido para que todo quepa en el ancho de la hoja */
html[data-orientacion-pdf="vertical"] .hoja-documento .hoja-tabla { table-layout: auto; width: 100%; min-width: 0; }
html[data-orientacion-pdf="vertical"] .hoja-documento .hoja-tabla col { width: auto !important; }
html[data-orientacion-pdf="vertical"] .hoja-documento .hoja-tabla th { font-size: 0.54rem; letter-spacing: 0; padding: 5px 4px; }
html[data-orientacion-pdf="vertical"] .hoja-documento .hoja-tabla td { font-size: 0.66rem; padding: 5px 4px; }
html[data-orientacion-pdf="vertical"] .hoja-documento .hoja-datos-grid.hoja-datos-3 { grid-template-columns: repeat(2, 1fr); }
html[data-orientacion-pdf="vertical"] .hoja-documento .hoja-firmas-doc { column-gap: 22px; }
/* Solicitud formal: en horizontal, motivo/transporte/gastos a la izquierda y la información a la derecha */
.formal-cuerpo { display: grid; grid-template-columns: minmax(0, 1fr); }
html:not([data-orientacion-pdf="vertical"]) .formal-cuerpo {
  grid-template-columns: minmax(0, 1fr) minmax(0, 2.2fr); column-gap: 28px;
  grid-template-areas: "motivo info" "transporte info" "gastos info";
}
html:not([data-orientacion-pdf="vertical"]) .formal-cuerpo .fa-motivo { grid-area: motivo; }
html:not([data-orientacion-pdf="vertical"]) .formal-cuerpo .fa-transporte { grid-area: transporte; }
html:not([data-orientacion-pdf="vertical"]) .formal-cuerpo .fa-info { grid-area: info; }
html:not([data-orientacion-pdf="vertical"]) .formal-cuerpo .fa-gastos { grid-area: gastos; }
html:not([data-orientacion-pdf="vertical"]) .formal-cuerpo .fa-info .hoja-datos-grid { grid-template-columns: repeat(3, 1fr); }
html:not([data-orientacion-pdf="vertical"]) .formal-cuerpo .hoja-seccion { margin-bottom: 14px; }
.grupo-ajustes { border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--sp-3) var(--sp-4) var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-4); min-width: 0; }
.grupo-ajustes legend { padding: 0 6px; font-weight: 700; font-size: var(--fs-sm); color: var(--text-100); }
.grupo-ajustes legend span { font-weight: 400; color: var(--text-500); font-size: var(--fs-xs); }
.aviso-datos { font-size: var(--fs-sm); line-height: 1.45; color: var(--state-pending); background: var(--state-pending-bg); border: 1px solid color-mix(in srgb, var(--state-pending) 35%, transparent); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: var(--sp-3); }
.aviso-datos a { color: var(--text-100); font-weight: 600; }
.hoja-datos-grid.hoja-datos-3 { grid-template-columns: repeat(3, 1fr); }
.ruc-ayuda { font-size: var(--fs-xs); line-height: 1.4; margin-top: 4px; min-height: 0; }
.ruc-ayuda:empty { display: none; }
.ruc-ayuda.ok { color: var(--state-ok); }
.ruc-ayuda.aviso { color: var(--state-pending); }
.ruc-ayuda.error { color: var(--danger); }
.resumen-filtro { font-size: var(--fs-sm); color: var(--text-500); margin: 0 0 var(--sp-3); }
.resumen-filtro strong { color: var(--text-100); }

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(4,6,10,0.7);
  backdrop-filter: blur(2px);
  display: flex; align-items: center; justify-content: center;
  z-index: 50; padding: var(--sp-4);
}
.modal {
  background: var(--surface-800);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-md);
  width: 100%; max-width: 480px;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-pop);
  overflow: hidden;
}
.modal h2 {
  font-family: var(--font-display); font-size: var(--fs-md);
  padding: var(--sp-5) var(--sp-5) 0;
  flex-shrink: 0;
}
.modal-body {
  padding: var(--sp-3) var(--sp-5);
  overflow-y: auto;
  flex: 1;
  -webkit-overflow-scrolling: touch;
}
.modal-actions {
  display: flex; justify-content: flex-end; gap: var(--sp-3);
  padding: var(--sp-4) var(--sp-5);
  border-top: 1px solid var(--line);
  flex-shrink: 0;
}

/* ---------- Toast ---------- */
#toast-region {
  position: fixed; bottom: var(--sp-5); right: var(--sp-5);
  display: flex; flex-direction: column; gap: var(--sp-2); z-index: 60;
}
.toast {
  background: var(--surface-700); color: var(--text-100);
  border: 1px solid var(--line-strong);
  padding: var(--sp-3) var(--sp-4); border-radius: var(--radius-sm);
  font-size: var(--fs-sm); box-shadow: var(--shadow-pop);
  max-width: 420px; cursor: pointer;
}
.toast-error { background: var(--danger-bg); color: #ffd6dc; border-color: color-mix(in srgb, var(--danger) 45%, transparent); }

/* ---------- Mobile nav ---------- */
.bottom-nav { display: none; }

@media (max-width: 860px) {
  #app-shell { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .view { padding: var(--sp-4); padding-bottom: calc(var(--bottomnav-h) + var(--sp-4) + env(safe-area-inset-bottom, 0px)); }
  .topbar { padding: env(safe-area-inset-top, 0px) var(--sp-4) 0; }
  /* Avisos en móvil: encima de la barra inferior, nunca tapándola */
  #toast-region { left: var(--sp-4); right: var(--sp-4); bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 48px); align-items: center; }

  .field-row { grid-template-columns: 1fr; }

  body { background-attachment: scroll; } /* el fondo "fijo" provoca saltos al desplazar en iPhone */
  body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px); background: var(--bg-950, #050507); z-index: 45; pointer-events: none; }
  .bottom-nav {
    display: flex;
    position: fixed; bottom: 0; left: 0; right: 0;
    height: calc(var(--bottomnav-h) + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--bg-900);
    border-top: 1px solid var(--line);
    z-index: 40;
  }
  .bottom-nav-item {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px;
    font-size: 0.65rem; font-weight: 600; color: var(--text-500);
  }
  .bottom-nav-item svg { width: 20px; height: 20px; }
  .bottom-nav-item.active { color: var(--gold-400); }
}
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--sp-4);
  margin-bottom: var(--sp-6);
}
@media (max-width: 1100px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .kpi-grid { grid-template-columns: 1fr; } }

.kpi-card {
  background: var(--paper-100);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--sp-4) var(--sp-5);
  display: flex; flex-direction: column; gap: 6px;
  position: relative;
}
.kpi-icon {
  position: absolute; top: var(--sp-4); right: var(--sp-4);
  width: 20px; height: 20px; color: var(--line-strong);
  opacity: 0.6;
}
.kpi-icon svg { width: 100%; height: 100%; }
.kpi-label {
  font-family: var(--font-mono);
  font-size: 0.65rem; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink-500);
  padding-right: 24px;
}
.kpi-value {
  font-family: var(--font-display);
  font-size: var(--fs-2xl);
  font-weight: 600;
  letter-spacing: -0.01em;
}
.kpi-value.small { font-size: var(--fs-xl); }
.kpi-sub { font-size: var(--fs-xs); color: var(--ink-500); }
.kpi-card.accent-danger .kpi-value { color: var(--danger); }
.kpi-card.accent-ledger .kpi-value { color: var(--ledger-700); }
.kpi-card.accent-success .kpi-value { color: var(--state-ok); }

.dash-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: var(--sp-5);
}
@media (max-width: 1100px) { .dash-grid { grid-template-columns: 1fr; } }

.section-title {
  font-family: var(--font-display);
  font-size: var(--fs-md);
  font-weight: 600;
  margin-bottom: var(--sp-4);
  padding-bottom: var(--sp-3);
  padding-left: 10px;
  border-bottom: 1px solid var(--line);
  border-left: 3px solid var(--gold-500);
  display: flex; align-items: center; justify-content: space-between;
}

.proj-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--sp-3) 0;
  border-bottom: 1px solid var(--line);
}
.proj-row:last-child { border-bottom: none; }
.proj-name { font-weight: 600; font-size: var(--fs-sm); }
.proj-meta { font-size: var(--fs-xs); color: var(--ink-500); }

.empty-state {
  text-align: center;
  padding: var(--sp-7) var(--sp-4);
  color: var(--ink-500);
}
.empty-state .lead { font-family: var(--font-display); font-size: var(--fs-md); color: var(--ink-900); margin-bottom: var(--sp-2); }
.toolbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: var(--sp-5); gap: var(--sp-3); flex-wrap: wrap;
}
.toolbar-filters { display: flex; gap: var(--sp-2); flex-wrap: wrap; }

.chip {
  padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--line); font-size: var(--fs-xs); font-weight: 600;
  color: var(--ink-500); background: var(--paper-100);
}
.chip.active { background: var(--gold-bg); color: var(--gold-400); border-color: var(--gold-500); }

.proj-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: var(--sp-4);
}

.proj-card {
  background: var(--paper-100);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--sp-4);
  display: flex; flex-direction: column; gap: var(--sp-3);
  cursor: pointer;
  transition: border-color 0.15s ease;
}
.proj-card:hover { border-color: var(--ink-500); }

.proj-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-2); }
.proj-card-title { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-md); }
.proj-card-client { font-size: var(--fs-xs); color: var(--ink-500); }

.state-tag {
  font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.08em;
  text-transform: uppercase; padding: 3px 8px; border-radius: 3px; font-weight: 700;
  flex-shrink: 0;
}
.state-planificado { background: var(--surface-600); color: var(--text-300); }
.state-activo { background: var(--stamp-ok-bg); color: var(--stamp-ok); }
.state-finalizado { background: #201a30; color: #a89bd6; }
.state-archivado { background: var(--surface-600); color: var(--text-500); }

.proj-card-metrics { display: flex; gap: var(--sp-5); }
.proj-card-metric .num { font-family: var(--font-mono); font-weight: 600; font-size: var(--fs-sm); }
.proj-card-metric .lbl { font-size: 0.65rem; color: var(--ink-500); text-transform: uppercase; letter-spacing: 0.04em; }

.detail-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: var(--sp-5); gap: var(--sp-4); flex-wrap: wrap;
}
.detail-title { font-family: var(--font-display); font-size: var(--fs-xl); font-weight: 600; }
.detail-meta { display: flex; gap: var(--sp-4); flex-wrap: wrap; margin-top: var(--sp-2); font-size: var(--fs-sm); color: var(--ink-500); }
.detail-actions { display: flex; gap: var(--sp-2); flex-wrap: wrap; }

.tabs { display: flex; gap: var(--sp-2); border-bottom: 1px solid var(--line); margin-bottom: var(--sp-5); overflow-x: auto; scrollbar-width: thin; }
.tab-btn {
  background: none; border: 0; border-radius: 0;
  padding: var(--sp-3) var(--sp-2); font-size: var(--fs-sm); font-weight: 600;
  color: var(--ink-500); border-bottom: 2px solid transparent; margin-bottom: -1px;
  flex: 0 0 auto; white-space: nowrap;
  transition: color .2s ease, border-color .25s ease;
}
.tab-btn.active { color: var(--ink-900); border-bottom-color: var(--ledger-700); }
.comprobante-preview {
  width: 100%;
  max-width: 480px;
  max-height: 70vh;
  object-fit: contain;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong);
  display: block;
  background: #fff;
}

.deteccion-card {
  background: var(--surface-600);
  border: 1px dashed var(--gold-500);
  border-radius: var(--radius-sm);
  padding: var(--sp-4);
  margin-top: var(--sp-3);
}
.deteccion-card h3 {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--gold-400);
  margin-bottom: var(--sp-3);
}
.deteccion-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--sp-3); }

.tabs-modo { display: flex; gap: var(--sp-2); margin-bottom: var(--sp-4); }
.tabs-modo .chip { cursor: pointer; }

.gasto-row {
  display: grid;
  grid-template-columns: 90px 1fr 100px 90px auto;
  gap: var(--sp-3);
  align-items: center;
  padding: var(--sp-3) 0;
  border-bottom: 1px solid var(--line);
  font-size: var(--fs-sm);
}
.gasto-row:last-child { border-bottom: none; }
.gasto-row .desc { font-weight: 500; }
.gasto-row .cat { font-size: var(--fs-xs); color: var(--text-500); }
.gasto-row .acciones { display: flex; gap: var(--sp-3); justify-content: flex-end; flex-wrap: wrap; }
.gasto-row .acciones button { display: inline-flex; align-items: center; gap: 4px; background: transparent; border: none; color: var(--text-500); padding: 4px; font-size: var(--fs-xs); white-space: nowrap; }
.gasto-row .acciones button:hover { color: var(--text-100); }

@media (max-width: 700px) {
  .gasto-row { grid-template-columns: 1fr; gap: 4px; }
  .gasto-row .acciones { justify-content: flex-start; margin-top: 4px; }
}

.entrada-rapida-box { display: flex; gap: var(--sp-2); }
.entrada-rapida-box input { flex: 1; }
.hoja-informe {
  background: #ffffff;
  color: #1a1a1a;
  max-width: 1050px;
  width: 100%;
  box-sizing: border-box;
  margin: 0 auto;
  padding: 26px 28px;
  border-radius: 3px;
  box-shadow: 0 30px 70px rgba(0,0,0,0.45);
  font-family: var(--font-body);
  line-height: 1.45;
}
.hoja-informe * { color: inherit; box-sizing: border-box; }
.hoja-informe table { max-width: 100%; }

.hoja-header {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 20px;
  border-bottom: 2.5px solid #e3311d; padding-bottom: 16px; margin-bottom: 22px;
}
.hoja-header-marca { flex: 0 0 auto; }
.hoja-header-doc { flex: 1 1 auto; text-align: right; }
.hoja-header .empresa { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; letter-spacing: -0.01em; }
.hoja-header .meta { font-size: 0.72rem; color: #6b6b6b; line-height: 1.5; margin-top: 3px; }

.hoja-titulo { font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; letter-spacing: 0.01em; text-transform: uppercase; }
.hoja-subtitulo { font-size: 0.72rem; color: #6b6b6b; margin-top: 2px; }

.hoja-seccion { margin-bottom: 26px; }
.hoja-seccion h3 {
  font-family: var(--font-display); font-size: 0.9rem; font-weight: 700; text-transform: none;
  letter-spacing: 0; color: #1a1a1a; border-left: 4px solid #e3311d; padding: 1px 0 1px 10px;
  margin-bottom: 14px; border-bottom: none;
}

.hoja-datos-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 28px; font-size: 0.85rem;
  background: #f2f2f2; border-radius: 4px; padding: 14px 16px;
}
.hoja-datos-grid .lbl { color: #6b6b6b; font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; font-weight: 600; }

.hoja-financiero { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.hoja-fin-item { background: #f2f2f2; border: 1px solid #e2e2e2; border-radius: 4px; padding: 11px 14px; }
.hoja-fin-item .lbl { font-size: 0.63rem; text-transform: uppercase; color: #6b6b6b; letter-spacing: 0.05em; margin-bottom: 2px; font-weight: 600; }
.hoja-fin-item .val { font-family: var(--font-mono); font-weight: 700; font-size: 1.05rem; }

.hoja-tabla-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  margin: 0 -4px;
  padding: 0 4px;
}

.hoja-tabla {
  width: 100%;
  min-width: 820px;
  table-layout: fixed;
  border-collapse: collapse;
  font-size: 0.85rem;
  line-height: 1.35;
}
.hoja-tabla.hoja-tabla-compacta { font-size: 0.78rem; min-width: 900px; }
.hoja-tabla th, .hoja-tabla td {
  overflow-wrap: break-word;
  word-break: normal;
}
.hoja-tabla th {
  text-align: left; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.04em;
  color: #ffffff; background: #1a1a1a; padding: 8px 9px; font-weight: 600;
}
.hoja-tabla td { padding: 7px 9px; border-bottom: 1px solid #e2e2e2; vertical-align: top; }
.hoja-tabla tr { page-break-inside: avoid; break-inside: avoid; }
.hoja-cat-banda { page-break-inside: avoid; break-inside: avoid; page-break-after: avoid; break-after: avoid; }
.hoja-tabla tr:last-child td { border-bottom: 1px solid #e2e2e2; }
.hoja-tabla tr.hoja-fila-par td { background: #f7f7f7; }
.hoja-tabla .num { font-family: var(--font-mono); text-align: right; white-space: nowrap; }
.hoja-nowrap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
/* Fecha completa dd/mm/aaaa: nunca se corta con "…" */
.hoja-fecha { font-family: var(--font-mono); font-size: 0.72rem; white-space: nowrap; }
.hoja-seccion h3 { break-after: avoid; page-break-after: avoid; } /* el título no queda solo al final de una hoja */
.hoja-tabla-px th, .hoja-tabla-px td { padding-left: 6px; padding-right: 6px; }
.hoja-tabla-px th { white-space: nowrap; }
/* RUC y N.º de factura NUNCA deben truncarse con "…" — se necesitan completos
   para la contabilidad. En vez de desbordarse sobre la celda vecina (lo que
   pasaba antes con nowrap+sin overflow), si no caben en una línea se parten
   a una segunda línea dentro de su propia celda (word-break), nunca se cortan
   ni se superponen. Fuente algo más chica para que quepan enteros casi siempre. */
.hoja-nowrap-full { font-family: var(--font-mono); font-size: 0.72rem; line-height: 1.3; word-break: break-word; overflow-wrap: anywhere; }
.hoja-tabla tfoot td { border-top: 1.5px solid #1a1a1a; border-bottom: none; padding-top: 9px; }

.hoja-anexo-encabezado { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.06em; text-transform: uppercase; color: #8a8f9a; }
.hoja-anexo-grid {
  font-size: 0; /* elimina el espacio en blanco entre inline-block por saltos de línea en el HTML */
}
.hoja-anexo-celda {
  display: block;
  width: 100%;
  margin: 0 0 8px 0;
  font-size: 1rem; /* restaurar el tamaño de fuente normal dentro de la celda */
  page-break-inside: avoid;
  break-inside: avoid;
  /* 1 comprobante por hoja: después de cada uno se fuerza una página nueva,
     excepto el último (para no dejar una hoja en blanco extra al final). */
  page-break-after: always;
  break-after: page;
}
.hoja-anexo-celda:last-child { page-break-after: auto; break-after: auto; margin-bottom: 0; }
.hoja-anexo-titulo { font-family: var(--font-display); font-weight: 600; font-size: 0.85rem; line-height: 1.2; display: inline; }
.hoja-anexo-meta { font-size: 0.72rem; color: #5c6270; margin-bottom: 4px; }
.hoja-anexo-img { display: block; width: auto; max-width: 100%; max-height: 760px; margin: 0 auto; object-fit: contain; background: #fff; }

.hoja-cat-banda {
  background: #f2f2f2; color: #1a1a1a; font-weight: 700; font-size: 0.72rem;
  letter-spacing: 0.03em; text-transform: uppercase; padding: 7px 10px 7px 12px;
  margin-top: 14px; border-left: 3px solid #e3311d;
}
.hoja-cat-banda:first-child { margin-top: 0; }

.hoja-estado-mini {
  font-family: var(--font-mono); font-size: 0.66rem; text-transform: uppercase;
  padding: 2px 6px; border-radius: 2px; border: 1px solid currentColor;
  display: inline-block; white-space: nowrap; font-weight: 700;
}
.hoja-estado-con { color: #1f8a4c; }
.hoja-estado-pendiente { color: #c77d10; }
.hoja-estado-sin { color: #d6271a; }

.hoja-firma-linea { border-top: 1px solid #1a1a1a; padding-top: 7px; font-size: 0.78rem; text-align: center; }
.hoja-firmas { display: table; width: 100%; table-layout: fixed; margin-top: 95px; break-inside: avoid; page-break-inside: avoid; }
.hoja-firmas.hoja-firmas-compacta { margin-top: 45px; }
.hoja-firma-bloque { display: table-cell; vertical-align: bottom; padding-right: 32px; break-inside: avoid; page-break-inside: avoid; min-height: 90px; }
.hoja-firma-bloque:last-child { padding-right: 0; }

.hoja-footer {
  margin-top: 36px; padding-top: 13px; border-top: 1px solid #e2e2e2;
  font-size: 0.66rem; color: #8a8a8a; display: flex; justify-content: space-between; letter-spacing: 0.02em;
}

@media screen and (max-width: 520px) {
  .hoja-informe { padding: 20px 16px; }
  .hoja-header { flex-direction: column; gap: 10px; }
  .hoja-header-doc { text-align: left; }
  .hoja-datos-grid { grid-template-columns: 1fr; }
  .hoja-financiero { grid-template-columns: repeat(2, 1fr); }
}


/* ============================================================
   ANIMACIONES — nivel "marcado" (elegido por el usuario en la demo)
   Todas se desactivan solas con "Reducir movimiento" del iPhone
   (regla prefers-reduced-motion al inicio de la hoja + chequeo en JS).
   ============================================================ */
:root { --ease-ios: cubic-bezier(.32,.72,0,1); --ease-spring: cubic-bezier(.34,1.56,.64,1); }

/* Toques: hundirse + onda desde el dedo */
.btn, .chip, .proj-card, a.card, .bottom-nav-item { position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent; }
.proj-card, a.card { transition: transform .3s var(--ease-spring), border-color .15s; }
.proj-card:active, a.card:active { transform: scale(.98); transition-duration: .08s; }
.chip { transition: transform .3s var(--ease-spring), background .15s, color .15s, border-color .15s; }
.chip:active { transform: scale(.94); transition-duration: .08s; }
.onda { position: absolute; border-radius: 50%; background: rgba(255,255,255,.32); transform: scale(0);
  pointer-events: none; animation: anim-onda .6s ease-out forwards; }
.btn-secondary .onda, .btn-ghost .onda, .chip .onda, .proj-card .onda, a.card .onda, .bottom-nav-item .onda { background: rgba(227,49,29,.25); }
@keyframes anim-onda { to { transform: scale(1); opacity: 0; } }

/* Entrada de pantallas: deslizamiento según dirección + bloques escalonados */
.view.anim-adelante { animation: anim-desde-derecha .42s var(--ease-ios); }
.view.anim-atras { animation: anim-desde-izquierda .42s var(--ease-ios); }
.anim-adelante .anim-bloque, .anim-atras .anim-bloque, .anim-lado .anim-bloque {
  animation: anim-aparecer .5s var(--ease-ios) backwards; animation-delay: calc(var(--i, 0) * 55ms + 60ms); }
.main-col.anim-recorte { overflow-x: clip; }
@keyframes anim-desde-derecha { from { transform: translateX(40px); } }
@keyframes anim-desde-izquierda { from { transform: translateX(-40px); } }
@keyframes anim-aparecer { from { opacity: 0; transform: translateY(16px); } }

/* Barra inferior: fondo que se desliza a la pestaña activa + rebote del ícono */
.bottom-nav-ind { display: none; }
.bottom-nav-item.rebota svg { animation: anim-rebote .5s var(--ease-spring); }
@keyframes anim-rebote { 30% { transform: scale(.72); } 65% { transform: scale(1.2); } 100% { transform: scale(1); } }

/* Botón principal de un formulario: círculo que gira → check verde que salta */
.btn .b-icono { display: none; position: relative; width: 18px; height: 18px; flex: none; }
.btn[data-estado="cargando"] .b-icono, .btn[data-estado="listo"] .b-icono { display: inline-block; }
.b-spin { position: absolute; inset: 0; border: 2px solid rgba(255,255,255,.3); border-top-color: currentColor;
  border-radius: 50%; animation: anim-girar .7s linear infinite; }
.btn[data-estado="listo"] .b-spin { display: none; }
.b-check { position: absolute; inset: 0; width: 18px; height: 18px; display: none; }
.b-check path { fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; }
.btn[data-estado="listo"] .b-check { display: block; }
.btn[data-estado="listo"] .b-check path { animation: anim-trazo .4s var(--ease-ios) forwards; }
.btn[data-estado="listo"] { background: var(--state-ok); color: #0b1a12; border-color: transparent; }
.btn.morph { padding-left: 0; padding-right: 0; border-radius: 999px; justify-content: center; }
.btn.morph .b-label { position: absolute; opacity: 0; }
.btn.pop { animation: anim-pop .45s var(--ease-spring); }
@keyframes anim-girar { to { transform: rotate(360deg); } }
@keyframes anim-trazo { to { stroke-dashoffset: 0; } }
@keyframes anim-pop { 0% { transform: scale(.85); } 60% { transform: scale(1.14); } 100% { transform: scale(1); } }

/* Ventanas: entrada y salida */
.modal-backdrop { animation: anim-fondo-entra .3s ease both; }
.modal { animation: anim-modal-entra .32s var(--ease-ios) both; }
.modal-backdrop.saliendo { animation: anim-fondo-sale .28s ease forwards; }
.modal-backdrop.saliendo .modal { animation: anim-modal-sale .28s var(--ease-ios) forwards; }
@keyframes anim-fondo-entra { from { opacity: 0; } }
@keyframes anim-fondo-sale { to { opacity: 0; } }
@keyframes anim-modal-entra { from { opacity: 0; transform: scale(.94); } }
@keyframes anim-modal-sale { to { opacity: 0; transform: scale(.96); } }
.main-col { transition: transform .45s var(--ease-ios), border-radius .45s var(--ease-ios), filter .45s var(--ease-ios); }

/* Avisos: entran con rebote y salen suave */
.toast { animation: anim-toast-entra .45s var(--ease-spring) both; }
.toast.saliendo { animation: anim-toast-sale .3s var(--ease-ios) forwards; }
@keyframes anim-toast-entra { from { opacity: 0; transform: translateY(16px) scale(.9); } }
@keyframes anim-toast-sale { to { opacity: 0; transform: translateY(10px) scale(.95); } }

/* Generar documento: hoja que se escribe + sello LISTO */
.doc-capa { position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.6); opacity: 0; transition: opacity .3s; }
.doc-capa.ver { opacity: 1; }
.doc-tarjeta { position: relative; background: var(--surface-800); border: 1px solid var(--line-strong); border-radius: 20px;
  padding: 22px 28px 18px; text-align: center; transform: scale(.85); transition: transform .45s var(--ease-spring); }
.doc-capa.ver .doc-tarjeta { transform: none; }
.doc-hoja { display: block; width: 110px; height: 138px; margin: 0 auto 12px; }
.doc-hoja .fondo-hoja { fill: #f7f6f2; }
.doc-hoja .linea { fill: none; stroke: #c9c6bf; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 80; stroke-dashoffset: 80; }
.doc-hoja .linea.cab { stroke: #e3311d; }
.doc-capa.escribiendo .linea { animation: anim-trazo .3s var(--ease-ios) forwards; animation-delay: calc(var(--i) * 150ms); }
.doc-sello { position: absolute; top: 62px; left: 50%; color: #e3311d; border: 3px solid #e3311d; border-radius: 8px; padding: 3px 10px;
  font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .08em;
  transform: translateX(-50%) rotate(-14deg) scale(2.2); opacity: 0; }
.doc-capa.sellado .doc-sello { animation: anim-sellar .45s var(--ease-spring) forwards; }
@keyframes anim-sellar { to { transform: translateX(-50%) rotate(-14deg) scale(1); opacity: 1; } }

@media (pointer: coarse) { .captura-arrastre { display: none; } }
.chips-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }

.chip-sec small { color: var(--text-500); margin-left: 4px; font-weight: 500; }
.chip-sec.active small { color: inherit; }
.btn-leer { width: 100%; justify-content: center; min-height: 52px; font-size: var(--fs-base); }
#form-gasto { display: flex; flex-direction: column; gap: var(--sp-4); }
.montos-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-3); }

.reparto-box { border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px; background: var(--surface-700); }
.reparto-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.reparto-suma { font-family: var(--font-mono); font-size: var(--fs-sm); font-weight: 600; }

.arq-row input:focus { border-color: var(--gold-500); }

  /** ¿Faltan los datos de la persona que usa la app (para solicitudes y firmas)? */
  function faltanDatosPersonales(config) {

  const MOVIMIENTO_REDUCIDO = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /** Cuenta un número desde 0 hasta su valor (saldos, totales, conteos).
   * Al terminar deja exactamente el texto original, sin alterar el dato. */
  function animarCifras(contenedor) {
    if (MOVIMIENTO_REDUCIDO) return;
    const formato = __modules__['utils/format'];
    contenedor.querySelectorAll('.kpi-value').forEach((el) => {
      const original = el.textContent.trim();
      let valor = null;
      let esMoneda = false;
      if (/^-?\d+$/.test(original)) {
        valor = Number(original);
      } else if (/\$/.test(original) && /\d/.test(original)) {
        const limpio = original.replace(/[^\d,-]/g, '').replace(/,(?=\d{2}$)/, '.').replace(/,/g, '');
        valor = Number(limpio);
        esMoneda = true;
      }
      if (valor === null || !Number.isFinite(valor) || valor === 0) return;
      const inicio = performance.now();
      const duracion = 900;
      const paso = (t) => {
        if (!el.isConnected) return;
        const p = Math.min(1, (t - inicio) / duracion);
        const e = 1 - Math.pow(1 - p, 3);
        const actual = valor * e;
        el.textContent = p < 1
          ? (esMoneda ? formato.formatoMoneda(actual) : String(Math.round(actual)))
          : original;
        if (p < 1) requestAnimationFrame(paso);
      };
      requestAnimationFrame(paso);
    });
  }

  /** Entrada de una pantalla: se desliza según la dirección (adelante/atrás)

  function animarEntradaVista(contenedor, direccion) {
    if (MOVIMIENTO_REDUCIDO || !contenedor) return;
    let bloques = Array.from(contenedor.children);
    if (bloques.length === 1 && bloques[0].children.length > 1) bloques = Array.from(bloques[0].children);
    bloques = bloques.slice(0, 12);
    bloques.forEach((el, i) => { el.style.setProperty('--i', Math.min(i, 9)); el.classList.add('anim-bloque'); });
    const columna = contenedor.closest('.main-col');
    const clase = 'anim-' + direccion;
    contenedor.classList.remove('anim-adelante', 'anim-atras', 'anim-lado');
    void contenedor.offsetWidth;
    contenedor.classList.add(clase);
    if (columna) columna.classList.add('anim-recorte');
    clearTimeout(contenedor._animT);
    contenedor._animT = setTimeout(() => {
      contenedor.classList.remove(clase);
      if (columna) columna.classList.remove('anim-recorte');
      bloques.forEach((el) => el.classList.remove('anim-bloque'));
    }, 1100);
    animarCifras(contenedor);

  /** Espera a que una pantalla termine de cargar (deje de mostrar "Cargando…"). */
  function esperarContenidoFinal(contenedor) {
    const soloCargando = () => contenedor.children.length === 1
      && contenedor.firstElementChild.classList.contains('empty-state')
      && /Cargando/i.test(contenedor.textContent);

    return new Promise((resolve) => {
      const obs = new MutationObserver(() => { if (!soloCargando()) { obs.disconnect(); resolve(); } });

    });
  }

  /** Conecta la lógica del formulario: reparto, estado por tipo, validaciones en vivo. */
  function activarFormulario(contenedor, cfg, { saldo, gastosExistentes, gastoActualId }) {
    const $ = (s) => contenedor.querySelector(s);
    const leerReparto = () => { const o = {}; contenedor.querySelectorAll('#reparto-grid input').forEach((i) => { const v = aNumeroCampo(i.value); if (v > 0) o[i.dataset.area] = v; }); return o; };
    const actualizarReparto = () => {
      const box = $('#reparto-box'); if (box.hidden) return;
      const rep = leerReparto(); const sum = redondear(Object.values(rep).reduce((a, b) => a + b, 0));
      const al = distribuir(cfg, { seccion: $('#g-seccion').value, total: aNumeroCampo($('#g-total').value) || 0, reparto: rep });
      contenedor.querySelectorAll('#reparto-grid [data-monto]').forEach((el) => { el.textContent = rep[el.dataset.monto] ? formatoMoneda(al[el.dataset.monto]) : ''; });
      const s = $('#reparto-suma'); s.textContent = `Suma: ${textoPorcentaje(sum)}`; s.style.color = Math.abs(sum - 100) < 0.01 ? 'var(--state-ok)' : 'var(--danger)';
    };
    const pintarReparto = () => {
      const sec = $('#g-seccion').value, box = $('#reparto-box');
      if (!esProrrateo(cfg, sec)) { box.hidden = true; return; }
      box.hidden = false; $('#reparto-titulo').textContent = `Distribución de ${sec} entre áreas`;
      const previo = (contenedor._repartoInicial && contenedor._repartoInicial.seccion === sec) ? contenedor._repartoInicial.reparto : (ultimoReparto[sec] || {});
      $('#reparto-grid').innerHTML = areasReceptoras(cfg).map((a) => `<label class="reparto-item"><span class="reparto-area">${esc(a)}</span><span class="reparto-in"><input type="number" step="0.01" min="0" max="100" inputmode="decimal" data-area="${esc(a)}" value="${previo[a] ? String(previo[a]) : ''}" placeholder="0" /><i>%</i></span><span class="reparto-monto tabular" data-monto="${esc(a)}"></span></label>`).join('');
      contenedor.querySelectorAll('#reparto-grid input').forEach((i) => i.addEventListener('input', actualizarReparto));
      actualizarReparto();
    };
    const revisar = (notasIA) => {
      const f = [];
      const sub = aNumeroCampo($('#g-subtotal').value) || 0, iva = aNumeroCampo($('#g-iva').value) || 0, tot = aNumeroCampo($('#g-total').value) || 0;
      if (notasIA) f.push(notasIA);
      if ((sub || iva) && Math.abs(sub + iva - tot) > 0.02) f.push(`Subtotal + IVA (${formatoMoneda(sub + iva)}) no coincide con el total.`);
      if (saldo != null && tot > saldo) f.push(`Supera el saldo disponible (${formatoMoneda(saldo)}).`);
      if ($('#g-fecha').value > hoyLocal()) f.push('La fecha es posterior a hoy.');
      const numero = $('#g-numero').value.trim(), ruc = $('#g-ruc').value.trim();
      if (numero && ruc && (gastosExistentes || []).some((g) => g.id !== gastoActualId && g.numero === numero && g.ruc === ruc)) f.push('Ya existe un comprobante con este número y RUC.');
      $('#g-flags').textContent = f.join(' ');
    };
    const revisarRuc = () => {
      const ayuda = $('#g-ruc-ayuda'); const v = $('#g-ruc').value.trim();
      ayuda.className = 'ruc-ayuda'; ayuda.textContent = '';
      if (!v) return;
      if (/^\d{10}$/.test(v)) { const c = __modules__['utils/validate'].validarCedulaEcuador(v); ayuda.classList.add(c.ok ? 'ok' : 'error'); ayuda.textContent = c.ok ? 'Cédula válida (persona natural)' : c.error; return; }
      const r = validarRucEcuador(v);
      if (!r.ok) { ayuda.classList.add('error'); ayuda.textContent = r.error; }
      else if (r.advertencia) { ayuda.classList.add('aviso'); ayuda.textContent = r.advertencia; }
      else { ayuda.classList.add('ok'); ayuda.textContent = `RUC válido (${r.tipo})`; }
    };
    $('#g-seccion').addEventListener('change', pintarReparto);
    $('#g-tipo').addEventListener('change', () => { $('#g-estado').value = estadoPorTipo($('#g-tipo').value); revisar(); });
    ['g-subtotal', 'g-iva', 'g-total', 'g-ruc', 'g-numero', 'g-estado', 'g-fecha'].forEach((id) => $('#' + id).addEventListener('input', () => revisar()));
    $('#g-total').addEventListener('input', actualizarReparto);
    $('#g-ruc').addEventListener('input', revisarRuc);
    $('#reparto-igual').addEventListener('click', () => { const ins = [...contenedor.querySelectorAll('#reparto-grid input')], n = ins.length; if (!n) return; const base = Math.floor(10000 / n) / 100; ins.forEach((i, k) => { i.value = String(k === n - 1 ? redondear(100 - base * (n - 1)) : base); }); actualizarReparto(); });
    $('#reparto-limpiar').addEventListener('click', () => { contenedor.querySelectorAll('#reparto-grid input').forEach((i) => { i.value = ''; }); actualizarReparto(); });
    pintarReparto(); revisarRuc(); revisar();
    /** Lee y valida; devuelve { ok, datos } o { ok:false, error, campo } */
    const leer = () => {
      const tot = aNumeroCampo($('#g-total').value);
      if (!(tot > 0)) return { ok: false, error: 'Ingresa el total del gasto.', campo: '#g-total' };
      if (!$('#g-motivo').value.trim()) return { ok: false, error: 'Escribe el motivo del gasto.', campo: '#g-motivo' };
      if (!$('#g-proveedor').value.trim() && !$('#g-concepto').value.trim()) return { ok: false, error: 'Ingresa el proveedor o la descripción.', campo: '#g-proveedor' };
      if (!$('#g-fecha').value) return { ok: false, error: 'Ingresa la fecha.', campo: '#g-fecha' };
      if ($('#g-fecha').value > hoyLocal()) return { ok: false, error: 'La fecha del gasto no puede ser posterior a hoy.', campo: '#g-fecha' };
      let sub = aNumeroCampo($('#g-subtotal').value) || 0, iva = aNumeroCampo($('#g-iva').value) || 0; if (!sub && !iva) sub = tot;
      const seccion = $('#g-seccion').value; let reparto = null;
      if (esProrrateo(cfg, seccion)) {
        reparto = leerReparto(); const sum = Object.values(reparto).reduce((a, b) => a + b, 0);
        if (Math.abs(sum - 100) >= 0.01) return { ok: false, error: `La distribución de ${seccion} suma ${textoPorcentaje(sum)}. Debe sumar 100 %.`, campo: '#reparto-box' };
      }
      return { ok: true, datos: { tipo: $('#g-tipo').value, estado: $('#g-estado').value, fecha: $('#g-fecha').value, seccion, proveedor: $('#g-proveedor').value.trim(), ruc: $('#g-ruc').value.replace(/\D/g, ''),
        numero: $('#g-numero').value.trim(), concepto: $('#g-concepto').value.trim(), categoria: $('#g-categoria').value, subtotal: sub, iva, total: tot, motivo: $('#g-motivo').value.trim(), reparto } };
    };
    const recordarReparto = (seccion, reparto) => { if (!reparto) return; ultimoReparto[seccion] = reparto; try { localStorage.setItem('cajachica-ultimo-reparto', JSON.stringify(ultimoReparto)); } catch (e) { /* sin memoria */ } };
    return { leer, revisar, recordarReparto };
  }

  function mostrarError(contenedor, r) {
    const flags = contenedor.querySelector('#g-flags'); if (flags) flags.textContent = r.error;
    const el = contenedor.querySelector(r.campo); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); if (el.focus) el.focus({ preventScroll: true }); }
    mostrarToast(r.error, 4000, 'error');
  }

    const [cfg, resumen, numero, conClave] = await Promise.all([obtenerConfig(), resumenFondo(), siguienteNumeroInforme(), hayClaveApi()]);

          </div>
          <!-- Cada opción abre su propio selector: cámara directa, fototeca, o la app Archivos / explorador -->
          <input type="file" accept="image/*" capture="environment" id="input-camara" hidden />

          <input type="file" accept="application/pdf,.pdf,.xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv,image/*" id="input-archivos" hidden />
          <div class="captura-botones">
            ${a ? `<button type="button" class="btn btn-ghost" id="btn-quitar">${icono('cerrar')} Quitar comprobante</button>` : `<button type="button" class="btn btn-ghost" id="btn-manual">Ingresar sin comprobante</button>`}
          </div>
          <div id="captura-estado" class="status-linea"></div>
        </div>
        <div class="card card-elevated" style="margin-bottom:var(--sp-4);">
          <div class="section-title" style="margin-bottom:var(--sp-3);">2 · ¿A qué sección corresponde?</div>
          <div class="chips-grid" id="chips-seccion">
            ${cfg.secciones.map((s) => `<button type="button" class="chip chip-sec ${estado.seccion === s.nombre ? 'active' : ''}" data-sec="${esc(s.nombre)}">${esc(s.nombre)}${s.prorratea ? ' <small>(%)</small>' : ''}</button>`).join('')}
          </div>
          <button type="button" class="btn btn-primary btn-leer" id="btn-leer" ${a && estado.seccion ? '' : 'disabled'}>${icono('ia')} ${conClave ? 'Leer con IA' : 'Leer comprobante'}</button>
          <div id="lectura-estado" class="status-linea">${a && !estado.seccion ? 'Elige la sección para leer el comprobante.' : !a ? 'Toma la foto o sube el archivo, elige la sección y léelo.' : ''}</div>
          ${!conClave ? `<p class="text-muted" style="font-size:var(--fs-xs); margin:6px 0 0;">Sin clave de API la lectura es local y menos precisa (PDF y Excel por su texto, fotos con OCR gratuito). <a href="#configuracion" style="color:var(--text-100); font-weight:600;">Agrega tu clave en Ajustes</a> para leer con IA.</p>` : ''}
        </div>
        <div class="card card-elevated" id="card-form" hidden>
          <div class="section-title" style="margin-bottom:var(--sp-3);">3 · Revisa los datos <span id="cola-info" class="text-muted" style="font-weight:500; font-size:var(--fs-sm);"></span></div>
          <div id="form-host"></div>
          <div class="sticky-actions">
            <button type="button" class="btn btn-primary" id="btn-guardar">Guardar gasto</button>
            <button type="button" class="btn btn-secondary" id="btn-descartar">Descartar</button>
          </div>
        </div>`;
      conectar();
    };
    const $ = (s) => contenedor.querySelector(s);
    const setEstadoCaptura = (msg, cls = '') => { const e = $('#captura-estado'); if (e) { e.className = 'status-linea ' + cls; e.innerHTML = msg; } };
    const setEstadoLectura = (msg, cls = '') => { const e = $('#lectura-estado'); if (e) { e.className = 'status-linea ' + cls; e.innerHTML = msg; } };
    const actualizarLeer = () => { const b = $('#btn-leer'); if (b) b.disabled = !(estado.archivo && estado.seccion) || estado.leyendo; };

    let form = null;
    const abrirFormulario = (d) => {

      const varios = estado.cola.length > 1;
      $('#cola-info').textContent = varios ? `(${estado.idx + 1} de ${estado.cola.length})` : '';
      $('#btn-guardar').textContent = varios && estado.idx < estado.cola.length - 1 ? 'Guardar y seguir' : 'Guardar gasto';
      $('#btn-guardar').disabled = false; // tras «Guardar y seguir» el botón quedaba bloqueado y no se podía guardar el siguiente
      $('#btn-descartar').textContent = varios ? 'Omitir este' : 'Descartar';
      card.hidden = false;
      card.scrollIntoView({ behavior: MOVIMIENTO_REDUCIDO ? 'auto' : 'smooth', block: 'start' });
    };
    const siguienteOReiniciar = () => {
      if (estado.cola.length > 1 && estado.idx < estado.cola.length - 1) { estado.idx++; abrirFormulario(estado.cola[estado.idx]); return; }
      estado.archivo = null; estado.cola = []; estado.idx = 0; estado.comprobanteId = null; contenedor._motivo = '';
      pintar();
    };
    const tomarArchivo = async (f) => {
      if (!f) return;
      if (estado.archivo?.urlMini) URL.revokeObjectURL(estado.archivo.urlMini);
      estado.archivo = null; estado.cola = []; estado.idx = 0; estado.comprobanteId = null;
      pintar();
      setEstadoCaptura('<span class="b-spin-inline"></span> Preparando el archivo…');
      try {
        const prep = await prepararArchivo(f);
        prep.urlMini = blobAUrl(prep.miniaturaBlob);
        estado.archivo = prep;
        pintar();
        setEstadoLectura(estado.seccion ? 'Archivo listo. Ahora léelo.' : 'Archivo listo. Elige la sección.');
      } catch (err) {
        pintar(); setEstadoCaptura(esc(err.message || 'No se pudo abrir el archivo.'), 'err');
      }
    };
    const leer = async () => {
      if (!estado.archivo || !estado.seccion || estado.leyendo) return;
      estado.leyendo = true; actualizarLeer();
      setEstadoLectura(`<span class="b-spin-inline"></span> Leyendo ${estado.archivo.kind === 'excel' ? 'el Excel' : estado.archivo.kind === 'pdf' ? 'el PDF' : 'el comprobante'}…${!conClave && estado.archivo.kind === 'foto' ? ' (la primera vez puede tardar unos segundos)' : ''}`);
      try {
        const r = await interpretarArchivo(estado.archivo);
        if (!r.ok) {
          const msg = { sin_conexion: 'Sin conexión a internet. Ingresa los datos a mano; la foto queda guardada igual.', clave_invalida: 'La clave de API no es válida. Revísala en Ajustes o ingresa los datos a mano.', ilegible: `No se reconoce un comprobante${r.detalle ? ': ' + esc(r.detalle) : ''}. Ingresa los datos a mano.`, sin_texto: 'No se pudo leer texto en la foto. Ingresa los datos a mano.' }[r.motivo] || `No se pudo leer${r.detalle ? ': ' + esc(String(r.detalle).replace(/\.+$/, '')) : ''}. Inténtalo de nuevo o ingrésalo a mano.`;
          setEstadoLectura(msg, 'err'); estado.cola = [{}]; estado.idx = 0; abrirFormulario({}); return;
        }
        estado.cola = r.comprobantes; estado.idx = 0;
        setEstadoLectura(r.comprobantes.length > 1 ? `Se encontraron ${r.comprobantes.length} gastos. Revísalos uno por uno.` : (r.metodo === 'ia' ? 'Datos leídos con IA. Revísalos abajo.' : 'Datos leídos (lectura local). Revísalos con cuidado.'), 'ok');
        abrirFormulario(r.comprobantes[0]);
      } finally { estado.leyendo = false; actualizarLeer(); }
    };
    const guardar = async () => {
      if (!form) return;
      const r = form.leer(); if (!r.ok) { mostrarError($('#form-host'), r); return; }
      const btn = $('#btn-guardar'); btn.disabled = true;
      try {
        if (estado.archivo && !estado.comprobanteId) {
          const c = await guardarComprobante(estado.archivo.imagenBlob, estado.archivo.miniaturaBlob, { nombre: estado.archivo.nombre, kind: estado.archivo.kind });
          estado.comprobanteId = c.id; // un solo anexo aunque el archivo traiga varios gastos
        }
        const g = crearGasto({ ...r.datos, comprobanteId: estado.comprobanteId, origen: estado.archivo ? estado.archivo.kind : 'manual', archivo: estado.archivo?.nombre || '' });
        await guardarGasto(g);
        form.recordarReparto(g.seccion, g.reparto);
        resumen.disponible = redondear(resumen.disponible - g.total); resumen.cantidadPorPresentar += 1; resumen.gastos.push(g);
        contenedor._motivo = $('#g-motivo').value.trim();
        mostrarToast(g.reparto ? `Guardado en ${numero} · distribuido: ${Object.entries(distribuir(cfg, g)).map(([a, v]) => `${a} ${formatoMoneda(v)}`).join(', ')}` : `Gasto guardado en el informe ${numero}`, 3500);
        siguienteOReiniciar();
      } catch (err) {
        console.error(err);
        const espacio = err && (err.name === 'QuotaExceededError' || /quota/i.test(err.message || ''));
        mostrarToast(espacio ? 'No hay espacio suficiente en el dispositivo para guardar. Exporta un respaldo y libera espacio.' : `No se pudo guardar: ${err?.message || 'error desconocido'}. Inténtalo de nuevo.`, 7000, 'error');

    function conectar() {
      const zona = $('#captura-zona');
      [['#op-camara', '#input-camara'], ['#op-fotos', '#input-fotos'], ['#op-archivos', '#input-archivos']].forEach(([boton, input]) => {
        $(boton).addEventListener('click', () => { const i = $(input); i.value = ''; i.click(); }); // value='' permite volver a elegir el mismo archivo
        $(input).addEventListener('change', (e) => tomarArchivo(e.target.files[0]));
      });

    console.error('Error fatal al iniciar la app', err);
    const vista = document.getElementById('vista') || document.body;
    vista.innerHTML = `
      <div class="empty-state" style="padding:48px 16px;">
        <p class="lead" style="color:var(--danger, #e0685f);">La aplicación no pudo iniciar correctamente</p>
        <p id="detalle-error-fatal"></p>
        <p style="font-size:0.75rem; color:var(--text-500, #888); margin-top:12px;">Toma una captura de esta pantalla completa (incluyendo este mensaje) para reportarlo.</p>
      </div>
    `;
    vista.querySelector('#detalle-error-fatal').textContent = (err && err.message) || 'Error desconocido';
  }
  async function iniciar() {
    try {
      mostrarIntroMarca();
      const configGeneral = await obtenerConfig();
      mostrarIntroMarca(configGeneral?.logo);
      // La app siempre abre en Inicio, nunca en la última pantalla donde estaba.
      try { if (/^https?:$/.test(location.protocol)) history.replaceState(null, '', '#dashboard'); } catch (e) {}
      renderSidebar();
      renderBottomNav();
      definirContenedor(document.getElementById('vista'));
      alNavegar((patron) => {
        marcarRutaActiva(patron);
        actualizarTopbar(patron);
        // Saldo disponible siempre visible en la barra superior
        resumenFondo().then((r) => __modules__['components/nav'].mostrarSaldoTopbar(`Disponible ${formatoMoneda(r.disponible)}`, r.disponible < 0)).catch(() => {});
      });
      registrarRuta('dashboard', renderDashboard);
      registrarRuta('gastos', renderGastos);
      registrarRuta('gastos/nuevo', renderRegistrar);
      registrarRuta('gastos/:id', renderDetalleGasto);
      registrarRuta('informes', renderInformes);
      registrarRuta('informes/mensual', renderInformesMensual);
      registrarRuta('informes/:id', renderInformes);
      registrarRuta('caja', renderCaja);
      registrarRuta('caja/arqueo', renderArqueo);
      registrarRuta('caja/arqueo/:id', renderActaArqueo);
      registrarRuta('configuracion', renderConfiguracion);
      iniciarRouter();
      await new Promise((resolver) => window.setTimeout(resolver, 2520)); // pantalla de entrada: ~3 s en total
      ocultarIntroMarca();
      appIniciada = true;
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
      // Igual que en Viáticos: se desregistra cualquier service worker viejo para que siempre cargue la versión más reciente.
      try { if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((registros) => { registros.forEach((reg) => reg.unregister()); }).catch(() => {}); } catch (e) {}
      try { if ('caches' in window) caches.keys().then((nombres) => { nombres.forEach((nombre) => caches.delete(nombre)); }).catch(() => {}); } catch (e) {}
    } catch (err) {
      ocultarIntroMarca();
      mostrarErrorFatal(err);
    }
  }
  // Mientras la app arranca se muestra la pantalla de error; ya iniciada, solo un aviso:
  // antes un fallo al guardar borraba la pantalla (y lo escrito) con "no pudo iniciar".
  let ultimoAvisoError = 0;
  function informarError(err) {
    if (!appIniciada) { mostrarErrorFatal(err); return; }
    console.error('Error no controlado', err);
    if (Date.now() - ultimoAvisoError < 1500) return; // un solo aviso por ráfaga
    ultimoAvisoError = Date.now();
    const detalle = (err && err.message) || 'Error desconocido';
    __modules__['components/toast'].mostrarToast(`Algo salió mal: ${detalle}. Lo que ya estaba guardado no se perdió; intenta de nuevo.`, 7000, 'error');
  }
  window.addEventListener('error', (event) => {
    // Aviso inofensivo del navegador al redimensionar; no es un error real de la app.
    if (/ResizeObserver loop/i.test(event.message || '')) { event.stopImmediatePropagation(); return; }
    informarError(event.error || new Error(event.message));
  });
  window.addEventListener('unhandledrejection', (event) => informarError(event.reason || new Error('Promesa rechazada sin manejar')));

  document.addEventListener('DOMContentLoaded', iniciar);

  // En iPhone, una barra "position: fixed" puede quedar a media pantalla después de que la página
  // cambia de alto o se cierra el teclado. Se mide dónde quedó y se devuelve al borde inferior visible.
  // Solo se corrige cuando cambia el tamaño visible (teclado, giro, cambio de pantalla), NUNCA mientras
  // se desliza el dedo: medir durante el desplazamiento movía la barra junto con el dedo.
  let _barraPendiente = false;
  let _tocando = false;
  function ajustarBarraInferior() {
    if (_barraPendiente) return; _barraPendiente = true;
    requestAnimationFrame(() => {
      _barraPendiente = false;
      const n = document.getElementById('bottom-nav'); if (!n) return;
      if (_tocando) return;
      if (getComputedStyle(n).display === 'none') { n.style.transform = ''; return; }
      n.style.transform = '';
      const r = n.getBoundingClientRect();
      const vv = window.visualViewport;
      const borde = vv ? vv.height + vv.offsetTop : window.innerHeight;
      const d = Math.round(borde - r.bottom);
      if (Math.abs(d) > 2 && Math.abs(d) < borde) n.style.transform = `translateY(${d}px)`;
    });
  }
  window.ajustarBarraInferior = ajustarBarraInferior;
  ['resize', 'orientationchange', 'hashchange', 'pageshow', 'focusout'].forEach((ev) => window.addEventListener(ev, ajustarBarraInferior, { passive: true }));
  if (window.visualViewport) visualViewport.addEventListener('resize', ajustarBarraInferior);
  // Mientras el dedo está sobre la pantalla la barra se queda quieta en su sitio
  window.addEventListener('touchstart', () => { _tocando = true; }, { passive: true });
  window.addEventListener('touchend', () => { _tocando = false; setTimeout(ajustarBarraInferior, 400); }, { passive: true });
  window.addEventListener('touchcancel', () => { _tocando = false; }, { passive: true });
  document.addEventListener('click', () => setTimeout(ajustarBarraInferior, 350), true);

  })();

})();

  </script>
</body>
